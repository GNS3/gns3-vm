# 99-gns3-bridge.conf - Disable iptables filtering of bridged traffic
# Installed to /etc/sysctl.d/99-gns3-bridge.conf
#
# Without this, traffic on GNS3 bridges (e.g. the Cloud node) is passed to
# the host's iptables/nftables rules when the br_netfilter module is loaded
# (e.g. by Docker), which can drop or mangle traffic between GNS3 nodes.
net.bridge.bridge-nf-call-iptables = 0
net.bridge.bridge-nf-call-ip6tables = 0
net.bridge.bridge-nf-call-arptables = 0
