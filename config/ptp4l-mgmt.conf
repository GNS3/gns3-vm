# PTP on the GNS3 VM management network: the VMs synchronize with each
# other (software timestamping, BMCA elects the master among them).

[global]
time_stamping        software
# Step the clock immediately on the first correction larger than 1 ms
# (the VMs start several ms apart, so they align at startup instead of
# slewing towards each other for a long time).
first_step_threshold 0.001
# Afterwards only step for offsets larger than 1 s; smaller offsets are
# slewed by the PI servo.
step_threshold       1.0
# (Measured lesson: logSyncInterval -2 plus moving_median filtering made
#  convergence worse -- 4 syncs/s push bridge/vCPU jitter noise into the
#  default PI servo, rms ~100us and oscillating; the 1/s default stays
#  within +/-100us. Do not add filtering.)
# One "master offset" line per second in the journal; summary_interval
# > 0 would turn them into rms/max summary lines.
summary_interval     0
