# Python CircleCI 2.1 configuration file
#
# Check https://circleci.com/docs/2.0/language-python/ for more details
#
version: 2.1

executors:
  docker-executor:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    working_directory: ~/repo

commands:

  setup:
    steps:
      - add_ssh_keys

      - run:
          name: Setup custom environment variables
          command: |
            echo "export GNS3_VERSION=\"${CIRCLE_TAG:-"v2.2.27"}\"" >> $BASH_ENV
            echo "export GNS3_NUMBER=\`echo \$GNS3_VERSION | sed \"s/^v//\"\`" >> $BASH_ENV

      - run:
          name: Install Python dependencies
          command: |
            python3 -m venv env
            source env/bin/activate
            python3 -m pip install boto3

      - run:
          name: Get EC2 builder
          no_output_timeout: 25m
          command: |
            source env/bin/activate
            DEVICE_IP=$(python3 .circleci/device.py get)
            echo "export DEVICE_IP=\"$DEVICE_IP\"" >> $BASH_ENV
            echo "Obtained device on $DEVICE_IP"
            mkdir -p ~/.ssh
            for attempt in $(seq 1 60); do
              if ssh-keyscan -T 5 -H "${DEVICE_IP}" > /tmp/builder-host-key 2>/dev/null; then
                cat /tmp/builder-host-key >> ~/.ssh/known_hosts
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "EC2 builder SSH did not become ready" >&2
                exit 1
              fi
              sleep 5
            done
            ssh -o BatchMode=yes -o ConnectTimeout=10 ubuntu@${DEVICE_IP} "sudo cloud-init status --wait"

      - run:
          name: Send heartbeats to EC2 builder
          background: true
          command: |
            # The builder shuts itself down when heartbeats stop (e.g. job cancelled)
            while true; do
              ssh -o BatchMode=yes -o ConnectTimeout=10 ubuntu@${DEVICE_IP} \
                "sudo touch /var/lib/gns3-builder/heartbeat" || echo "Heartbeat failed"
              sleep 60
            done

      - run:
          name: Install dependencies and clone repository on device
          command: |
            ssh ubuntu@${DEVICE_IP} "sudo bash -c '
              set -e
              apt update
              apt install -y 7zip git pv
              if [ ! -d gns3-vm ]
              then
                git clone https://github.com/GNS3/gns3-vm.git
              fi
              cd gns3-vm
              git checkout ${CIRCLE_SHA1}
            '"

  finalize:
    parameters:
      architecture:
        type: string
    steps:
      - run:
          name: Gather artifacts from device
          when: always
          command: |
            mkdir -p "artifacts/<< parameters.architecture >>"
            if [ -z "${DEVICE_IP:-}" ]; then
              echo "No EC2 builder IP is available for artifact collection" >&2
              exit 1
            fi
            ssh -o BatchMode=yes -o ConnectTimeout=10 "ubuntu@${DEVICE_IP}" "ls -lah gns3-vm"
            scp -o BatchMode=yes -o ConnectTimeout=10 ubuntu@${DEVICE_IP}:"gns3-vm/${ARTIFACT_GLOB}" "artifacts/<< parameters.architecture >>/"

      - run:
          name: Terminate EC2 builder
          when: always
          no_output_timeout: 25m
          command: |
            if [ -x env/bin/python ] && env/bin/python -c 'import boto3'; then
              env/bin/python .circleci/device.py destroy
            else
              echo "Skipping EC2 cleanup because builder provisioning did not start"
            fi

      - store_artifacts:
          path: artifacts
          destination: artifacts

      - persist_to_workspace:
          root: artifacts
          paths:
            - << parameters.architecture >>

jobs:
  x86-build:
    executor: docker-executor

    environment:
        EC2_ARCHITECTURE: x86_64
        ARTIFACT_GLOB: "GNS3.VM.*.{zip,tar.xz,ova}"

    steps:
      - checkout
      - setup

      - run:
          name: Install VirtualBox
          command: |
            ssh ubuntu@${DEVICE_IP} "sudo bash -c '
              set -e
              apt -y install virtualbox
            '"

      - run:
          name: Install VMWare
          command: |
            echo "
              set -e

              if [ ! -f "/tmp/VMWare.bundle" ]
              then
                wget https://github.com/201853910/VMwareWorkstation/releases/download/26H1/VMware-Workstation-Full-26H1u1-25688693.x86_64.bundle -O /tmp/VMWare.bundle
              fi

              chmod a+x /tmp/VMWare.bundle

              /tmp/VMWare.bundle --eulas-agreed --required --console
              /etc/init.d/vmware restart
            " > script.sh
            scp script.sh ubuntu@${DEVICE_IP}:
            ssh ubuntu@${DEVICE_IP} "sudo bash script.sh"

      - run:
          name: Install Packer for AMD64 & Qemu
          command: |
            ssh ubuntu@${DEVICE_IP} "sudo bash -c '
              set -e

              if [ ! -f "/tmp/packer.zip" ]
              then
                wget https://releases.hashicorp.com/packer/1.16.0/packer_1.16.0_linux_amd64.zip -O /tmp/packer.zip
              fi

              7z e -y /tmp/packer.zip -o/usr/local/bin/
              /usr/local/bin/packer plugins install github.com/hashicorp/virtualbox
              /usr/local/bin/packer plugins install github.com/hashicorp/vmware
              /usr/local/bin/packer plugins install github.com/hashicorp/qemu
              apt install -y genisoimage qemu-utils qemu-system-x86
              test -c /dev/kvm
            '"

      - run:
          name: Build base x86_64 VM
          command: |
            ssh ubuntu@${DEVICE_IP} "sudo bash -c '
              set -e

              cd gns3-vm
              ./build_base_vm.sh
            '"

      - run:
          name: Release VMWare VM
          command: |
            ssh ubuntu@${DEVICE_IP} "sudo bash -c '
              set -e

              cd gns3-vm

              if [ ! -e \"GNS3.VM.VMware.Workstation.${GNS3_NUMBER}.ova\" ];
              then
                ./release_vmware.sh ${GNS3_VERSION}
              fi
            '"

      - run:
          name: Release Hyper-V VM
          command: |
            ssh ubuntu@${DEVICE_IP} "sudo bash -c '
              set -e

              cd gns3-vm

              if [ ! -e \"GNS3.VM.Hyper-V.${GNS3_NUMBER}.zip\" ];
              then
                ./release_hyperv.sh ${GNS3_VERSION}
              fi
            '"

      - run:
          name: Release KVM VM
          command: |
            ssh ubuntu@${DEVICE_IP} "sudo bash -c '
              set -e

              cd gns3-vm

              if [ ! -e \"GNS3.VM.KVM.${GNS3_NUMBER}.zip\" ];
              then
                ./release_kvm.sh ${GNS3_VERSION}
              fi
            '"

      - run:
          name: Release VMWare ESXI VM
          command: |
            ssh ubuntu@${DEVICE_IP} "sudo bash -c '
              set -e

              cd gns3-vm

              if [ ! -e \"GNS3.VM.VMware.ESXI.${GNS3_NUMBER}.ova\" ];
              then
                ./release_vmware_esxi.sh ${GNS3_VERSION} GNS3.VM.VMware.Workstation.${GNS3_NUMBER}.ova
              fi
            '"

      - run:
          name: Release VirtualBox VM
          command: |
            ssh ubuntu@${DEVICE_IP} "sudo bash -c '
              set -e

              cd gns3-vm

              if [ ! -e \"GNS3.VM.VirtualBox.${GNS3_NUMBER}.ova\" ];
              then
                ./release_virtualbox.sh ${GNS3_VERSION} GNS3.VM.VMware.Workstation.${GNS3_NUMBER}.ova
              fi
            '"

      - finalize:
          architecture: x86_64

  arm64-build:
    executor: docker-executor

    environment:
        EC2_ARCHITECTURE: arm64
        ARTIFACT_GLOB: "GNS3.VM.UTM.ARM64.*.tar.xz"

    steps:
      - checkout
      - setup

      - run:
          name: Install Packer for ARM64 & Qemu
          command: |
            ssh ubuntu@${DEVICE_IP} "sudo bash -c '
              set -e

              if [ ! -f "/tmp/packer.zip" ]
              then
                wget https://releases.hashicorp.com/packer/1.16.0/packer_1.16.0_linux_arm64.zip -O /tmp/packer.zip
              fi

              7z e -y /tmp/packer.zip -o/usr/local/bin/
              /usr/local/bin/packer plugins install github.com/hashicorp/qemu
              apt install -y xorriso # needed by packer
              apt install -y qemu-utils qemu-system-arm qemu-efi-aarch64
            '"

      - run:
          name: Build base ARM64 VM
          no_output_timeout: 20m
          command: |
            ssh ubuntu@${DEVICE_IP} "sudo bash -c '
              set -e

              cd gns3-vm
              ./build_base_vm_arm64.sh
            '"

      - run:
          name: Release QEMU ARM64 VM
          no_output_timeout: 20m
          command: |
            ssh ubuntu@${DEVICE_IP} "sudo bash -c '
              set -e

              cd gns3-vm
              if [ ! -e \"GNS3.VM.UTM.ARM64.${GNS3_NUMBER}.tar.xz\" ];
              then
                ./release_qemu_arm64.sh ${GNS3_VERSION}
              fi
            '"

      - finalize:
          architecture: arm64

  publish-release:
    executor: docker-executor
    steps:
      - add_ssh_keys
      - attach_workspace:
          at: workspace

      - run:
          name: Install GitHub CLI
          command: |
            (type -p wget >/dev/null || (sudo apt update && sudo apt install wget -y)) \
            && sudo mkdir -p -m 755 /etc/apt/keyrings \
            && out=$(mktemp) && wget -nv -O$out https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            && cat $out | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null \
            && sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg \
            && sudo mkdir -p -m 755 /etc/apt/sources.list.d \
            && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
            && sudo apt update \
            && sudo apt install gh -y

      - run:
          name: Combine artifacts and generate SHA256SUMS
          command: |
            mkdir -p artifacts
            shopt -s nullglob
            for architecture in x86_64 arm64; do
              files=(workspace/"$architecture"/GNS3.VM.*.{zip,tar.xz,ova})
              if [ "${#files[@]}" -eq 0 ]; then
                echo "No release artifacts were collected for $architecture" >&2
                exit 1
              fi
              for file in "${files[@]}"; do
                name=${file##*/}
                if [ -e "artifacts/$name" ]; then
                  echo "Duplicate release artifact: $name" >&2
                  exit 1
                fi
                mv -- "$file" "artifacts/$name"
              done
            done
            cd artifacts
            files=(GNS3.VM.*.{zip,tar.xz,ova})
            sha256sum -- "${files[@]}" > SHA256SUMS
            cat SHA256SUMS
            sha256sum -c SHA256SUMS

      - run:
          name: Deploying on Github and SourceForge
          command: |
            echo "Deploying version ${CIRCLE_TAG} on GitHub"
            shopt -s nullglob
            artifacts=(artifacts/GNS3.VM.*.{zip,tar.xz,ova} artifacts/SHA256SUMS)
            for file in "${artifacts[@]}"; do
              echo "Uploading $file to GitHub"
              gh release upload "${CIRCLE_TAG}" "$file" --clobber
            done

            echo "Deploying version ${CIRCLE_TAG} on SourceForge"
            mkdir -p ~/.ssh
            ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts
            scp "${artifacts[@]}" gns3build@frs.sourceforge.net:"/home/frs/project/gns-3/Releases/${CIRCLE_TAG}/"

      - store_artifacts:
          path: artifacts
          destination: artifacts

workflows:
  build_only_on_tag:
    jobs:
      - x86-build:
          filters:
            tags:
              only: /v3.*/
            branches:
              ignore: /.*/
      - arm64-build:
          filters:
            tags:
              only: /v3.*/
            branches:
              ignore: /.*/
      - publish-release:
          requires:
            - x86-build
            - arm64-build
          filters:
            tags:
              only: /v3.*/
            branches:
              ignore: /.*/
