# Python CircleCI 2.1 configuration file
#
# Check https://circleci.com/docs/2.0/language-python/ for more details
#
version: 2.1

executors:
  docker-executor:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    working_directory: ~/repo

commands:

  setup:
    steps:
      - add_ssh_keys

      - run:
          name: Setup custom environment variables
          command: |
            echo "export GNS3_VERSION=\"${CIRCLE_TAG:-"v2.2.27"}\"" >> $BASH_ENV
            echo "export GNS3_NUMBER=\`echo \$GNS3_VERSION | sed \"s/^v//\"\`" >> $BASH_ENV

      - run:
          name: Install Python dependencies
          command: |
            python3 -m venv env
            source env/bin/activate
            python3 -m pip install boto3

      - run:
          name: Get EC2 builder
          no_output_timeout: 25m
          command: |
            source env/bin/activate
            DEVICE_IP=$(python3 .circleci/device.py get)
            echo "export DEVICE_IP=\"$DEVICE_IP\"" >> $BASH_ENV
            echo "Obtained device on $DEVICE_IP"
            mkdir -p ~/.ssh
            for attempt in $(seq 1 60); do
              if ssh-keyscan -T 5 -H "${DEVICE_IP}" > /tmp/builder-host-key 2>/dev/null; then
                cat /tmp/builder-host-key >> ~/.ssh/known_hosts
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "EC2 builder SSH did not become ready" >&2
                exit 1
              fi
              sleep 5
            done
            ssh -o BatchMode=yes -o ConnectTimeout=10 ubuntu@${DEVICE_IP} "sudo cloud-init status --wait"

      - run:
          name: Install dependencies and clone repository on device
          command: |
            ssh ubuntu@${DEVICE_IP} "sudo bash -c '
              set -e
              apt update
              apt install -y 7zip git
              if [ ! -d gns3-vm ]
              then
                git clone https://github.com/GNS3/gns3-vm.git
              fi
              cd gns3-vm
              git checkout ${CIRCLE_SHA1}
            '"

  finalize:
    steps:
      - run:
          name: Gather artifacts from device
          when: always
          command: |
            mkdir -p artifacts
            if [ -z "${DEVICE_IP:-}" ]; then
              echo "No EC2 builder IP is available for artifact collection" >&2
              exit 1
            fi
            scp -o BatchMode=yes -o ConnectTimeout=10 ubuntu@${DEVICE_IP}:"gns3-vm/${ARTIFACT_GLOB}" artifacts

      - run:
          name: Terminate EC2 builder
          when: always
          no_output_timeout: 25m
          command: |
            if [ -x env/bin/python ] && env/bin/python -c 'import boto3'; then
              env/bin/python .circleci/device.py destroy
            else
              echo "Skipping EC2 cleanup because builder provisioning did not start"
            fi

      - run:
          name: Generate SHA256 checksums
          when: always
          command: |
            cd artifacts
            shopt -s nullglob
            files=(*.zip *.tar.xz)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "No build artifacts were collected" >&2
              exit 1
            fi
            for file in "${files[@]}"
            do
              sha256sum "$file" >> "GNS3.VM.checksums.sha256"
            done
            cat "GNS3.VM.checksums.sha256"
            sha256sum -c "GNS3.VM.checksums.sha256"
            ls -l
            cd -

      - run:
          name: Deploying on Github and SourceForge
          when: always
          command: |
            source env/bin/activate
            python3 -m pip install -U pip
            git clone git@github.com:GNS3/gns3-build.git
            cd gns3-build
            python3 -m pip install -r requirements.txt
            cd ..

            echo "Deploying version ${CIRCLE_TAG} on GitHub"
            ls -l artifacts
            shopt -s nullglob
            for file in artifacts/GNS3.VM.*.{zip,tar.xz,sha256}
            do
              echo "Uploading $file to GitHub"
              python3 gns3-build/upload.py ${CIRCLE_TAG} $file
            done

            echo "Deploying version ${CIRCLE_TAG} on SourceForge"
            ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts
            scp artifacts/GNS3.VM.* gns3build@frs.sourceforge.net:"/home/frs/project/gns-3/Releases/${CIRCLE_TAG}/"

      - store_artifacts:
          path: artifacts
          destination: artifacts

jobs:
  x86-build:
    executor: docker-executor

    environment:
        EC2_ARCHITECTURE: x86_64
        ARTIFACT_GLOB: "GNS3*.zip"

    steps:
      - checkout
      - setup

      - run:
          name: Install VirtualBox
          command: |
            ssh ubuntu@${DEVICE_IP} "sudo bash -c '
              set -e
              apt -y install linux-headers-\$(uname -r)
              wget -q -O- http://download.virtualbox.org/virtualbox/debian/oracle_vbox_2016.asc | apt-key add -
              wget -q -O- http://download.virtualbox.org/virtualbox/debian/oracle_vbox.asc | apt-key add -
              apt-add-repository \"deb [arch=amd64] http://download.virtualbox.org/virtualbox/debian \$(lsb_release -cs) contrib\"
              apt update && apt -y install virtualbox-7.0
            '"

      - run:
          name: Install VMWare
          command: |
            echo "
              set -e

              if [ ! -f "/tmp/VMWare.bundle" ]
              then
                wget https://sourceforge.net/projects/gns-3/files/VMware/VMware-Workstation-Full-17.6.3-24583834.x86_64.bundle/download -O /tmp/VMWare.bundle
              fi

              chmod a+x /tmp/VMWare.bundle

              /tmp/VMWare.bundle --eulas-agreed --required --console
              /usr/lib/vmware/bin/vmware-vmx --new-sn ${VMWARE_17_SERIAL}
              /etc/init.d/vmware restart
            " > script.sh
            scp script.sh ubuntu@${DEVICE_IP}:
            ssh ubuntu@${DEVICE_IP} "sudo bash script.sh"

      - run:
          name: Install Packer for amd64 & Qemu
          command: |
            ssh ubuntu@${DEVICE_IP} "sudo bash -c '
              set -e

              if [ ! -f "/tmp/packer.zip" ]
              then
                wget https://releases.hashicorp.com/packer/1.12.0/packer_1.12.0_linux_amd64.zip -O /tmp/packer.zip
              fi

              7z e -y /tmp/packer.zip -o/usr/local/bin/
              /usr/local/bin/packer plugins install github.com/hashicorp/virtualbox
              /usr/local/bin/packer plugins install github.com/hashicorp/vmware
              /usr/local/bin/packer plugins install github.com/hashicorp/qemu
              apt install -y genisoimage qemu-utils qemu-system-x86 qemu-kvm
              test -c /dev/kvm
            '"

      - run:
          name: Release VMWare VM
          command: |
            ssh ubuntu@${DEVICE_IP} "sudo bash -c '
              set -e

              cd gns3-vm

              if [ ! -e \"GNS3.VM.VMware.Workstation.${GNS3_NUMBER}.zip\" ];
              then
                ./build_base_vm.sh
                ./release_vmware.sh ${GNS3_VERSION} GNS3VM.Base.$(cat version).zip
              fi
            '"

      - run:
          name: Release VirtualBox VM
          command: |
            ssh ubuntu@${DEVICE_IP} "sudo bash -c '
              set -e

              cd gns3-vm

              if [ ! -e \"GNS3.VM.VirtualBox.${GNS3_NUMBER}.zip\" ];
              then
                ./release_virtualbox.sh ${GNS3_VERSION} GNS3.VM.VMware.Workstation.${GNS3_NUMBER}.zip
              fi
            '"

      - run:
          name: Release Hyper-V VM
          command: |
            ssh ubuntu@${DEVICE_IP} "sudo bash -c '
              set -e

              cd gns3-vm

              if [ ! -e \"GNS3.VM.Hyper-V.${GNS3_NUMBER}.zip\" ];
              then
                ./release_hyperv.sh ${GNS3_VERSION} GNS3VM.Base.$(cat version).zip
              fi
            '"

      - run:
          name: Release KVM VM
          command: |
            ssh ubuntu@${DEVICE_IP} "sudo bash -c '
              set -e

              cd gns3-vm

              cp \"GNS3.VM.VirtualBox.${GNS3_NUMBER}.zip\" /tmp/GNS3VM.VirtualBox.${GNS3_NUMBER}.zip

              if [ ! -e \"GNS3.VM.KVM.${GNS3_NUMBER}.zip\" ];
              then
                ./release_kvm.sh ${GNS3_VERSION}
              fi
            '"

      - run:
          name: Release VMWare ESXI VM
          command: |
            ssh ubuntu@${DEVICE_IP} "sudo bash -c '
              set -e

              cd gns3-vm

              cp \"GNS3.VM.VMware.Workstation.${GNS3_NUMBER}.zip\" /tmp/GNS3VM.VMware.${GNS3_NUMBER}.zip

              if [ ! -e \"GNS3.VM.VMware.ESXI.${GNS3_NUMBER}.zip\" ];
              then
                ./release_vmware_esxi.sh ${GNS3_VERSION}
              fi
            '"

      - finalize

  arm64-build:
    executor: docker-executor

    environment:
        EC2_ARCHITECTURE: arm64
        ARTIFACT_GLOB: "GNS3.VM.UTM.ARM64.*.tar.xz"

    steps:
      - checkout
      - setup

      - run:
          name: Install Packer for ARM64
          command: |
            ssh ubuntu@${DEVICE_IP} "sudo bash -c '
              set -e

              if [ ! -f "/tmp/packer.zip" ]
              then
                wget https://releases.hashicorp.com/packer/1.12.0/packer_1.12.0_linux_arm64.zip -O /tmp/packer.zip
              fi

              7z e -y /tmp/packer.zip -o/usr/local/bin/
              /usr/local/bin/packer plugins install github.com/hashicorp/qemu
              apt install -y xorriso # needed by packer
            '"

      - run:
          name: Release QEMU ARM64 VM
          no_output_timeout: 20m
          command: |
            ssh ubuntu@${DEVICE_IP} "sudo bash -c '
              set -e

              cd gns3-vm

              if [ ! -e \"GNS3.VM.UTM.ARM64.${GNS3_NUMBER}.tar.xz\" ];
              then
                apt install -y qemu-utils qemu-system-arm qemu-efi-aarch64
                ./build_base_vm_arm64.sh
                ./release_qemu_arm64.sh ${GNS3_VERSION} GNS3VM.Base.ARM64.$(cat version).zip
              fi
            '"

      - finalize

workflows:
  build_only_on_tag:
    jobs:
      - x86-build:
          filters:
            tags:
              only: /v3.*/
            branches:
              ignore: /.*/
      - arm64-build:
          filters:
            tags:
              only: /v3.*/
            branches:
              ignore: /.*/
