# Python CircleCI 2.1 configuration file
#
# Check https://circleci.com/docs/2.0/language-python/ for more details
#
version: 2.1

executors:
  docker-executor:
    docker:
      - image: cimg/python:3.8
    resource_class: small
    working_directory: ~/repo

commands:

  setup:
    steps:
      - run:
          name: Setup custom environment variables
          command: |
            echo "export GNS3_VERSION=\"${CIRCLE_TAG:-"v2.2.27"}\"" >> $BASH_ENV
            echo "export GNS3_NUMBER=\`echo \$GNS3_VERSION | sed \"s/^v//\"\`" >> $BASH_ENV

      - run:
          name: Install Python dependencies
          command: |
            python3 -m venv env
            source env/bin/activate
            python3 -m pip install packet-python

      - run:
          name: Get builder device
          no_output_timeout: 15m
          command: |
            source env/bin/activate
            DEVICE_IP=`python3 .circleci/device.py ${EQUINIX_TOKEN} get "${EQUINIX_PROJECT}" ${DEVICE_TYPE}`
            echo "export DEVICE_IP=\"$DEVICE_IP\"" >> $BASH_ENV
            echo "Obtained device on $DEVICE_IP"
            ssh-keyscan -H ${DEVICE_IP} >> ~/.ssh/known_hosts

      - run:
          name: Clone repository on device
          command: |
            ssh root@${DEVICE_IP} "
              set -e
              if [ ! -d "~/gns3-vm" ]
              then
                git clone https://github.com/GNS3/gns3-vm.git
                cd gns3-vm
                git checkout focal-stable
              fi
            "

  finalize:
    steps:
      - run:
          name: Gather artifacts from device
          when: always
          command: |
            mkdir artifacts
            scp root@${DEVICE_IP}:"gns3-vm/GNS3*.zip" artifacts

      - run:
          name: Destroy device
          when: always
          command: |
            source env/bin/activate
            python3 .circleci/device.py ${EQUINIX_TOKEN} destroy "${EQUINIX_PROJECT}" ${DEVICE_TYPE}

      - run:
          name: Generate SHA256 checksums
          when: always
          command: |
            cd artifacts
            for file in *.zip
            do
              sha256sum "$file" > "$file.sha256"
              cat "$file.sha256"
              sha256sum -c "$file.sha256"
            done
            ls -l
            cd -

      - run:
          name: Deploying on Github and SourceForge
          when: always
          command: |
            source env/bin/activate
            python3 -m pip install -U pip
            git clone git@github.com:GNS3/gns3-build.git
            cd gns3-build
            python3 -m pip install -r requirements.txt
            cd ..

            echo "Deploying version ${CIRCLE_TAG} on GitHub"
            for file in artifacts/GNS3.VM.*.{zip,sha256}
            do
              python3 gns3-build/upload.py ${CIRCLE_TAG} $file
            done

            echo "Deploying version ${CIRCLE_TAG} on SourceForge"
            ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts
            scp artifacts/GNS3.VM.* gns3build@frs.sourceforge.net:"/home/frs/project/gns-3/Releases/${CIRCLE_TAG}/"

      - store_artifacts:
          path: artifacts
          destination: artifacts

jobs:
  x86-build:
    executor: docker-executor

    environment:
        DEVICE_TYPE: m3.small.x86

    steps:
      - checkout
      - setup

      - run:
          name: Install VirtualBox
          command: |
            ssh root@${DEVICE_IP} "
              set -e
              apt update
              apt -y install linux-headers-\$(uname -r) git 7zip
              wget -q -O- http://download.virtualbox.org/virtualbox/debian/oracle_vbox_2016.asc | apt-key add -
              wget -q -O- http://download.virtualbox.org/virtualbox/debian/oracle_vbox.asc | apt-key add -
              apt-add-repository \"deb [arch=amd64] http://download.virtualbox.org/virtualbox/debian \$(lsb_release -cs) contrib\"
              apt update
              apt -y install virtualbox-7.0
            "

      - run:
          name: Install VMWare
          command: |
            echo "
              set -e

              if [ ! -f "/tmp/VMWare.bundle" ]
              then
                wget https://sourceforge.net/projects/gns-3/files/VMware/VMware-Workstation-Full-17.6.3-24583834.x86_64.bundle/download -O /tmp/VMWare.bundle
              fi

              chmod a+x /tmp/VMWare.bundle

              /tmp/VMWare.bundle --eulas-agreed --required --console
              /usr/lib/vmware/bin/vmware-vmx --new-sn ${VMWARE_17_SERIAL}
              /etc/init.d/vmware restart
            " > script.sh
            scp script.sh root@${DEVICE_IP}:
            ssh root@${DEVICE_IP} "bash script.sh"

      - run:
          name: Install Packer for amd64
          command: |
            ssh root@${DEVICE_IP} "
              set -e

              if [ ! -f "/tmp/packer.zip" ]
              then
                wget https://releases.hashicorp.com/packer/1.12.0/packer_1.12.0_linux_amd64.zip -O /tmp/packer.zip
              fi

              7z e -y /tmp/packer.zip -o/usr/local/bin/
              chmod +x /usr/local/bin/packer
              /usr/local/bin/packer plugins install github.com/hashicorp/virtualbox
              /usr/local/bin/packer plugins install github.com/hashicorp/vmware
            "

      - run:
          name: Release VirtualBox VM
          command: |
            ssh root@${DEVICE_IP} "
              set -e

              cd gns3-vm

              if [ ! -e \"GNS3.VM.VirtualBox.${GNS3_NUMBER}.zip\" ];
              then
                ./virtualbox.sh
                ./release_virtualbox.sh ${GNS3_VERSION} GNS3VM.VirtualBox.0.16.0.zip
              fi
            "

      - run:
          name: Release Hyper-V VM
          command: |
            ssh root@${DEVICE_IP} "
              set -e

              cd gns3-vm

              if [ ! -e \"GNS3.VM.Hyper-V.${GNS3_NUMBER}.zip\" ];
              then
                ./release_hyperv.sh ${GNS3_VERSION} GNS3VM.VirtualBox.0.16.0.zip
              fi
            "

      - run:
          name: Release KVM VM
          command: |
            ssh root@${DEVICE_IP} "
              set -e

              cd gns3-vm

              if [ ! -e \"GNS3.VM.KVM.${GNS3_NUMBER}.zip\" ];
              then
                apt install -y qemu-utils
                ./release_kvm.sh ${GNS3_VERSION}
              fi
            "

      - run:
          name: Release VMWare VM
          command: |
            ssh root@${DEVICE_IP} "
              set -e

              cd gns3-vm

              if [ ! -e \"GNS3.VM.VMware.Workstation.${GNS3_NUMBER}.zip\" ];
              then
                ./vmware.sh
                ./release_vmware.sh ${GNS3_VERSION} GNS3VM.VMware.0.16.0.zip
              fi
            "

      - run:
          name: Release VMWare ESXI VM
          command: |
            ssh root@${DEVICE_IP} "
              set -e

              cd gns3-vm

              cp \"GNS3.VM.VMware.Workstation.${GNS3_NUMBER}.zip\" /tmp/GNS3VM.VMware.${GNS3_NUMBER}.zip

              if [ ! -e \"GNS3.VM.VMware.ESXI.${GNS3_NUMBER}.zip\" ];
              then
                ./release_vmware_esxi.sh ${GNS3_VERSION}
              fi
            "

      - finalize

  arm64-build:
    executor: docker-executor

    environment:
        DEVICE_TYPE: c3.large.arm

    steps:
      - checkout
      - setup

      - run:
          name: Install Packer for ARM64
          command: |
            ssh root@${DEVICE_IP} "
              set -e

              if [ ! -f "/tmp/packer.zip" ]
              then
                apt update && apt install -y 7zip
                wget https://releases.hashicorp.com/packer/1.12.0/packer_1.12.0_linux_arm64.zip -O /tmp/packer.zip
              fi

              7z e -y /tmp/packer.zip -o/usr/local/bin/
              chmod +x /usr/local/bin/packer
              /usr/local/bin/packer plugins install github.com/hashicorp/qemu
            "

      - run:
          name: Release QEMU ARM64 VM
          no_output_timeout: 20m
          command: |
            ssh root@${DEVICE_IP} "
              set -e

              cd gns3-vm

              if [ ! -e \"GNS3.VM.ARM64.${GNS3_NUMBER}.zip\" ];
              then
                apt install -y qemu-utils qemu-system-arm qemu-efi-aarch64
                ./qemu_arm64.sh
                ./release_qemu_arm64.sh ${GNS3_VERSION} GNS3VM.ARM64.0.16.0.zip
              fi
            "

      - finalize

workflows:
  build_only_on_tag:
    jobs:
      - x86-build:
          filters:
            tags:
              only: /v2.*/
            branches:
              ignore: /.*/
      - arm64-build:
          filters:
            tags:
              only: /v2.*/
            branches:
              ignore: /.*/
